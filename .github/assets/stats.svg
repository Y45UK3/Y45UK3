<svg xmlns="http://www.w3.org/2000/svg" width="450" height="300" viewBox="0 0 450 300">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111d3d"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#22314f" stroke-width="1" opacity=".35"/></pattern>
  <style>
    .title{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#ffffff}
    .main{font:700 15px 'JetBrains Mono','Courier New',monospace;fill:#ffffff}
    .sub{font:500 10px 'JetBrains Mono','Courier New',monospace;fill:#8ea3c7}
  </style>
</defs>
<rect width="100%" height="100%" rx="14" fill="url(#bg)" stroke="#2b3b5f"/>
<rect width="100%" height="100%" rx="14" fill="url(#grid)"/>
<rect x="0" y="0" width="5" height="300" rx="3" fill="#4570C0"/>
<text x="24" y="34" class="title">GitHub Stats</text>
<text x="426" y="34" text-anchor="end" class="sub">TELEMETRY // INITIALIZING</text>
<g transform="translate(225 145)">
  <circle r="54" fill="none" stroke="#263b63" stroke-width="8"/>
  <path d="M0 -54 A54 54 0 0 1 46.8 -27" fill="none" stroke="#4570C0" stroke-width="8" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.2s" repeatCount="indefinite"/>
  </path>
</g>
<text x="225" y="222" text-anchor="middle" class="main">AWAITING FIRST SYNC</text>
<text x="225" y="243" text-anchor="middle" class="sub">GITHUB ACTIONS WILL POPULATE THIS MODULE</text>
</svg>