<svg xmlns="http://www.w3.org/2000/svg" width="450" height="300" viewBox="0 0 450 300">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111d3d"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#ffffff}
    .main{font:700 16px 'JetBrains Mono','Courier New',monospace;fill:#ffffff;letter-spacing:1px}
    .sub{font:500 10px 'JetBrains Mono','Courier New',monospace;fill:#8ea3c7}
  </style>
</defs>
<rect width="100%" height="100%" rx="14" fill="url(#bg)" stroke="#2b3b5f"/>
<rect x="0" y="0" width="5" height="300" rx="3" fill="#E30118"/>
<text x="24" y="34" class="title">Top Languages</text>
<text x="426" y="34" text-anchor="end" class="sub">MODULE // LOCKED</text>
<circle cx="225" cy="150" r="68" fill="none" stroke="#263b63" stroke-width="24"/>
<circle cx="225" cy="150" r="48" fill="#0b1327" stroke="#1e2b57"/>
<circle cx="225" cy="150" r="5" fill="#E30118" filter="url(#glow)">
  <animate attributeName="opacity" values=".35;1;.35" dur="1.5s" repeatCount="indefinite"/>
</circle>
<text x="225" y="185" text-anchor="middle" class="main">PRIVATE DATA</text>
<text x="225" y="205" text-anchor="middle" class="sub">LANGUAGE TELEMETRY NOT CONNECTED</text>
<text x="225" y="265" text-anchor="middle" class="sub">READ-ONLY REPO ACCESS REQUIRED</text>
</svg>