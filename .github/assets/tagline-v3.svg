<svg xmlns="http://www.w3.org/2000/svg" width="900" height="76" viewBox="0 0 900 76">
<defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-weight:600;fill:#f4f7fb}
    .line{font-size:18px;letter-spacing:.1px}
  </style>
</defs>
<rect width="900" height="76" fill="transparent"/>
<g text-anchor="middle" transform="translate(450 45)">
  <text class="line" opacity="1">Esports Operations • Networking • Automation • Development
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.225;.25;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text class="line" opacity="0">Building production tools and internal systems
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.225;.25;.475;.5;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text class="line" opacity="0">Turning operational problems into practical software
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.475;.5;.725;.75;1" dur="16s" repeatCount="indefinite"/>
  </text>
  <text class="line" opacity="0">AI workflows • Networks • Internal tools • Production systems
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.725;.75;.975;1" dur="16s" repeatCount="indefinite"/>
  </text>
</g>
</svg>