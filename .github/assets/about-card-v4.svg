<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111d3d"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#22314f" stroke-width="1" opacity=".25"/></pattern>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .k{font-size:11px;font-weight:700;fill:#7890b7;letter-spacing:1.1px}
    .hero{font-size:22px;font-weight:800;fill:#fff}
    .muted{font-size:13px;font-weight:500;fill:#9fb2d0}
    .v{font-size:14px;font-weight:650;fill:#e9f0fb}
  </style>
</defs>
<rect width="900" height="180" rx="16" fill="url(#bg)" stroke="#2b3b5f"/>
<rect width="900" height="180" rx="16" fill="url(#grid)"/>
<rect x="0" width="6" height="180" rx="3" fill="#E30118"/>
<text x="34" y="40" class="k">PROFILE // SUMMARY</text>
<text x="34" y="76" class="hero">Esports Operations • Networking • Software Development</text>
<text x="34" y="104" class="muted">Practical systems, automation, infrastructure, and production workflows.</text>
<g transform="translate(34 132)"><text class="k">FOCUS</text><text y="24" class="v">Operations • Networks • Internal Tools • Automation</text></g>
<g transform="translate(650 132)"><text class="k">LOCATION</text><text y="24" class="v">Sri Lanka</text></g>
</svg>