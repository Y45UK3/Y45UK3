name: Refresh profile telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/scripts/update-activity.mjs"
      - ".github/scripts/notify-discord.mjs"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh current activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node .github/scripts/update-activity.mjs

      - name: Commit refreshed telemetry
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/tech-panel-v4.svg .github/assets/current-focus-v4.svg
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No telemetry changes."
          else
            git commit -m "chore: refresh profile telemetry [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord
        if: always() && (github.event_name != 'schedule' || steps.commit.outputs.changed == 'true')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: node .github/scripts/notify-discord.mjs
