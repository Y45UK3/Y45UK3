name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/update-stats.mjs"
      - ".github/scripts/notify-discord.mjs"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate profile statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-stats.mjs

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/contributions.svg .github/assets/languages.svg .github/assets/stats.svg
          if git diff --cached --quiet; then
            echo "No profile-stat changes to commit."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: node .github/scripts/notify-discord.mjs
