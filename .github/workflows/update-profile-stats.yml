name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/update-stats.mjs"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate profile statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-stats.mjs

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/contributions.svg .github/assets/languages.svg
          if git diff --cached --quiet; then
            echo "No profile-stat changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile stats"
          git push
